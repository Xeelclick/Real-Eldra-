services:
  - type: web
    name: eldra-coin-app
    runtime: docker
    plan: starter
    region: frankfurt # or oregon, ohio, singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: eldra-mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: eldra-mysql
          property: port
      - key: DB_NAME
        fromDatabase:
          name: eldra-mysql
          property: database
      - key: DB_USER
        fromDatabase:
          name: eldra-mysql
          property: user
      - key: DB_PASS
        fromDatabase:
          name: eldra-mysql
          property: password

databases:
  - name: eldra-mysql
    databaseName: eldra_coin
    user: eldra_user
    plan: starter
    region: frankfurt
