version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=eldra_coin
      - DB_USER=eldra_user
      - DB_PASS=secret_eldra_pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eldra-network

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_master_password
      MYSQL_DATABASE: eldra_coin
      MYSQL_USER: eldra_user
      MYSQL_PASSWORD: secret_eldra_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./php-backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_master_password"]
      timeout: 5s
      retries: 10
      interval: 3s
    networks:
      - eldra-network

volumes:
  db_data:

networks:
  eldra-network:
    driver: bridge
